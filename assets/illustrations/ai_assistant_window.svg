    <linearGradient id="bookFill" x1="280" y1="252" x2="280" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#F6E9D4"/>
