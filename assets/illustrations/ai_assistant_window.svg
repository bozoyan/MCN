    <linearGradient id="leafFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9D2A5"/>
      <stop offset="1" stop-color="#B1BE87"/>
    </linearGradient>
    <linearGradient id="potFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3E4C6"/>
      <stop offset="1" stop-color="#DFC49C"/>
