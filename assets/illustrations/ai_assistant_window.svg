<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" fill="none">
  <defs>
    <linearGradient id="windowSky" x1="280" y1="54" x2="280" y2="215" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8F4EC"/>
      <stop offset="0.18" stop-color="#EAF5FB"/>
      <stop offset="0.58" stop-color="#D6EAF2"/>
      <stop offset="1" stop-color="#EDF4F5"/>
    </linearGradient>
    <linearGradient id="archFrame" x1="280" y1="32" x2="280" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5E4BF"/>
      <stop offset="0.55" stop-color="#F0DAB2"/>
      <stop offset="1" stop-color="#E9D2A8"/>
    </linearGradient>
    <linearGradient id="archFrame2" x1="280" y1="38" x2="280" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF9ED"/>
      <stop offset="0.35" stop-color="#FFF4E2"/>
      <stop offset="1" stop-color="#F7E8CC"/>
    </linearGradient>
    <radialGradient id="rightGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(420 168) rotate(180) scale(146 124)">
      <stop offset="0" stop-color="#FFF2C8" stop-opacity="0.95"/>
      <stop offset="0.42" stop-color="#FFF0CF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFF3DB" stop-opacity="0"/>
