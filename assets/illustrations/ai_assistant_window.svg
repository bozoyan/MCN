    <radialGradient id="warmGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(278 256) rotate(90) scale(68 188)">
      <stop offset="0" stop-color="#F7D899" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#F7D899" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
