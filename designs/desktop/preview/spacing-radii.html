<!doctype html>
<!-- @dsCard group="Spacing" -->
<html lang="en"><head><meta charset="utf-8"><title>Radii</title>
<script src="../../theme.js"></script>

<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">

</head><body><div class="card-pad">
<div class="row-tight" style="gap:14px">
  
    <div class="col" style="gap:4px;align-items:center">
      <div style="width:48px;height:48px;background:var(--surface-container-high);border:1px solid var(--border-input);border-radius:6px"></div>
      <div class="spec">6 · small</div>
    </div>
    <div class="col" style="gap:4px;align-items:center">
      <div style="width:48px;height:48px;background:var(--surface-container-high);border:1px solid var(--border-input);border-radius:8px"></div>
      <div class="spec">8 · medium</div>
    </div>
    <div class="col" style="gap:4px;align-items:center">
      <div style="width:48px;height:48px;background:var(--surface-container-high);border:1px solid var(--border-input);border-radius:12px"></div>
      <div class="spec">12 · large · input</div>
    </div>
    <div class="col" style="gap:4px;align-items:center">
      <div style="width:48px;height:48px;background:var(--surface-container-high);border:1px solid var(--border-input);border-radius:14px"></div>
      <div class="spec">14 · xl · menu</div>
    </div>
    <div class="col" style="gap:4px;align-items:center">
      <div style="width:48px;height:48px;background:var(--surface-container-high);border:1px solid var(--border-input);border-radius:18px"></div>
      <div class="spec">18 · 2xl · card</div>
    </div>
    <div class="col" style="gap:4px;align-items:center">
      <div style="width:48px;height:48px;background:var(--surface-container-high);border:1px solid var(--border-input);border-radius:20px"></div>
      <div class="spec">20 · full</div>
    </div>
    <div class="col" style="gap:4px;align-items:center">
      <div style="width:48px;height:48px;background:var(--surface-container-high);border:1px solid var(--border-input);border-radius:999px"></div>
      <div class="spec">999 · pill · button</div>
    </div>
</div>
<div class="spec">Cards, panels and dialogs use 18 (2xl); every button is a pill (999).</div>
</div></body></html>
