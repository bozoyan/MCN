<!doctype html>
<!-- @dsCard group="Colors" -->
<html lang="en"><head><meta charset="utf-8"><title>Ink green accent</title>
<script src="../../theme.js"></script>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">

</head><body><div class="card-pad">
<div class="eyebrow">Accent — for action + state only · Reveric light</div>
<div class="row-tight">
  <div class="col" style="gap:4px;flex:1;min-width:80px">
    <div style="height:48px;border-radius:6px;background:#1C2623;border:1px solid var(--border-subtle)"></div>
    <div class="spec" style="color:var(--text-primary);font-weight:600">accent</div>
    <div class="spec">#1C2623</div>
  </div>
  <div class="col" style="gap:4px;flex:1;min-width:80px">
    <div style="height:48px;border-radius:6px;background:#2D3A36;border:1px solid var(--border-subtle)"></div>
    <div class="spec" style="color:var(--text-primary);font-weight:600">accent-warm</div>
    <div class="spec">#2D3A36</div>
  </div>
  <div class="col" style="gap:4px;flex:1;min-width:80px">
    <div style="height:48px;border-radius:6px;background:#2A9C78;border:1px solid var(--border-subtle)"></div>
    <div class="spec" style="color:var(--text-primary);font-weight:600">accent-amber</div>
    <div class="spec">#2A9C78</div>
  </div>
  <div class="col" style="gap:4px;flex:1;min-width:80px">
    <div style="height:48px;border-radius:6px;background:#FFFFFF;border:1px solid var(--border-subtle)"></div>
    <div class="spec" style="color:var(--text-primary);font-weight:600">on-accent</div>
    <div class="spec">#FFFFFF</div>
  </div>
</div>
<div class="spec">"The Writer‑First Rule": deep ink green is for action and state, not decoration; amber marks AI and small emphasis.</div>
