<!doctype html>
<!-- @dsCard group="Components" -->
<html lang="en"><head><meta charset="utf-8"><title>AI composer</title>
<script src="../../theme.js"></script>

<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<link rel="stylesheet" href="../kit.css">

<style>body{background:var(--canvas)} .card-pad{padding:24px}</style>
</head><body><div class="card-pad">
<div class="m-composer" style="max-width:480px;margin:0">
  <div class="m-composer__slash">
    <img src="../assets/icons/phosphor/magic-wand.svg" width="12"/>
    <span>/润色</span>
    <img src="../assets/icons/phosphor/x.svg" width="10"/>
  </div>
  <div class="m-composer__field">
    <textarea class="m-composer__input" rows="2" placeholder="对当前章节提问，或描述想要的修改…"></textarea>
  </div>
  <div class="m-composer__toolbar">
    <div class="m-composer__tools">
      <button class="m-icon-btn"><img src="../assets/icons/phosphor/paperclip.svg" width="14"/></button>
      <button class="m-icon-btn"><img src="../assets/icons/phosphor/article.svg" width="14"/></button>
    </div>
    <button class="m-btn m-btn--primary m-btn--sm"><img src="../assets/icons/phosphor/paper-plane.svg" width="14"/>发送</button>
  </div>
</div>
</div></body></html>
