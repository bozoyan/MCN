<!doctype html>
<!-- @dsCard group="Colors" -->
<html lang="en"><head><meta charset="utf-8"><title>Paper surfaces</title>
<script src="../../theme.js"></script>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">

</head><body><div class="card-pad">
<div class="eyebrow">Tonal layer scale (light → high) · Reveric light</div>
<div class="row-tight">
  <div class="col" style="gap:4px;flex:1;min-width:80px">
    <div style="height:48px;border-radius:6px;background:#F2F6F4;border:1px solid var(--border-subtle)"></div>
    <div class="spec" style="color:var(--text-primary);font-weight:600">canvas</div>
    <div class="spec">#F2F6F4</div>
  </div>
  <div class="col" style="gap:4px;flex:1;min-width:80px">
    <div style="height:48px;border-radius:6px;background:#FFFFFF;border:1px solid var(--border-subtle)"></div>
    <div class="spec" style="color:var(--text-primary);font-weight:600">surface</div>
    <div class="spec">#FFFFFF</div>
  </div>
  <div class="col" style="gap:4px;flex:1;min-width:80px">
    <div style="height:48px;border-radius:6px;background:#EAF0ED;border:1px solid var(--border-subtle)"></div>
    <div class="spec" style="color:var(--text-primary);font-weight:600">surface-dim</div>
    <div class="spec">#EAF0ED</div>
  </div>
  <div class="col" style="gap:4px;flex:1;min-width:80px">
    <div style="height:48px;border-radius:6px;background:#F6F9F7;border:1px solid var(--border-subtle)"></div>
    <div class="spec" style="color:var(--text-primary);font-weight:600">surface-container</div>
    <div class="spec">#F6F9F7</div>
  </div>
  <div class="col" style="gap:4px;flex:1;min-width:80px">
    <div style="height:48px;border-radius:6px;background:#FFFFFF;border:1px solid var(--border-subtle)"></div>
    <div class="spec" style="color:var(--text-primary);font-weight:600">surface-container-high</div>
    <div class="spec">#FFFFFF</div>
  </div>
</div>
<div class="spec">Cards float on these layers with --shadow-card and no visible border; chrome and inputs stay flat.</div>
</div></body></html>
