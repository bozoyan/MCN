<!doctype html>
<!-- @dsCard group="Colors" -->
<html lang="en"><head><meta charset="utf-8"><title>Semantic</title>
<script src="../../theme.js"></script>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">

</head><body><div class="card-pad">
<div class="eyebrow">Semantic · Reveric light</div>
<div class="row-tight">
  <div class="col" style="gap:4px;flex:1">
    <div style="height:36px;border-radius:6px;background:#E6F1EA;border:1px solid #2F7A55;color:#2F7A55;display:flex;align-items:center;padding:0 10px;font:500 11px var(--font-sans)">addition</div>
    <div class="spec">addition · #E6F1EA / #2F7A55</div>
  </div>
  <div class="col" style="gap:4px;flex:1">
    <div style="height:36px;border-radius:6px;background:#FBE9E6;border:1px solid #B83A2E;color:#B83A2E;display:flex;align-items:center;padding:0 10px;font:500 11px var(--font-sans)">deletion</div>
    <div class="spec">deletion · #FBE9E6 / #B83A2E</div>
  </div>
  <div class="col" style="gap:4px;flex:1">
    <div style="height:36px;border-radius:6px;background:#FBF0DC;border:1px solid #B26A12;color:#B26A12;display:flex;align-items:center;padding:0 10px;font:500 11px var(--font-sans)">warning</div>
    <div class="spec">warning · #FBF0DC / #B26A12</div>
  </div>
  <div class="col" style="gap:4px;flex:1">
    <div style="height:36px;border-radius:6px;background:transparent;border-left:3px solid #8ED0B8;display:flex;align-items:center;padding:0 10px;font:italic 13px var(--font-serif);color:var(--text-secondary)">blockquote</div>
    <div class="spec">blockquote · #8ED0B8</div>
  </div>
</div>
</div></body></html>
