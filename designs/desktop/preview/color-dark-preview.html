<!doctype html>

<html lang="en"><head><meta charset="utf-8"><title>Dark mode preview</title>
<script src="../../theme.js"></script>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">

</head><body><div class="card-pad">
<div class="row" style="gap:8px">
  <div style="flex:1;background:#0F1412;border:1px solid #2A3330;border-radius:8px;padding:16px;color:#E8EEEB">
    <div style="font:700 16px/1.2 var(--font-display);margin-bottom:6px">夜航船</div>
    <div style="font:400 12px var(--font-sans);color:#8E9190">Night Boat</div>
    <div style="font:italic 12px Georgia;color:#C2C0BA;margin-top:8px;padding-left:8px;border-left:2px solid #4CC49C">"船家的灯笼挂在桅杆上…"</div>
    <div style="display:inline-block;margin-top:10px;padding:4px 10px;background:#E4ECE8;color:#0F1412;border-radius:6px;font:500 11px var(--font-sans)">jade-white accent on ink</div>
  </div>
  <div class="col" style="width:200px;gap:4px">
    <div class="eyebrow" style="color:var(--text-muted)">Reveric Dark</div>
    <div class="spec">canvas #0F1412</div>
    <div class="spec">surface #161C1A</div>
    <div class="spec">text-primary #E8EEEB</div>
    <div class="spec">accent #E4ECE8</div>
    <div class="spec">accent-amber #4CC49C</div>
  </div>
</div>
