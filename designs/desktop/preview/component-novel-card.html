<!doctype html>
<!-- @dsCard group="Components" -->
<html lang="en"><head><meta charset="utf-8"><title>Novel card</title>
<script src="../../theme.js"></script>

<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<link rel="stylesheet" href="../kit.css">

<style>body{background:var(--canvas)} .card-pad{padding:24px}</style>
</head><body><div class="card-pad">
<div class="m-novel-card" style="max-width:280px">
  <div class="m-cover" style="background:linear-gradient(160deg,#3E524C 0%,#2D3A36 55%,#1C2623 100%);aspect-ratio:8/5;padding:16px;display:flex;align-items:flex-end">
    <div class="m-cover__title"><div class="m-cover__title-en">夜航船</div></div>
  </div>
  <div class="m-novel-card__body">
    <div class="m-novel-card__head">
      <h3 class="m-novel-card__title">夜航船</h3>
    </div>
    <div class="m-novel-card__sub">Night Boat</div>
    <p class="m-novel-card__desc">明末江南，一艘逆流而上的客船载着失意的画师、逃婚的小姐、隐姓的旧官。</p>
    <div class="m-novel-card__tags"><span class="m-tag">长篇</span><span class="m-tag">明末</span></div>
  </div>
</div>
</div></body></html>
