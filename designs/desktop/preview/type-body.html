<p style="font:400 16px/1.75 var(--font-serif);color:var(--text-primary);margin:0;max-width:600px;text-wrap:pretty">船家的灯笼挂在桅杆上，照见雨水沿着甲板的纹路缓缓淌下去。周清远把伞收好，伞骨在他袖中微微作响。他没有看身后那两人——他知道，越是不看，越是被看。</p>
