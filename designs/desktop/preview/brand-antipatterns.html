<!doctype html>
<!-- @dsCard group="Brand" -->
<html lang="en"><head><meta charset="utf-8"><title>Anti‑patterns to avoid</title>
<script src="../../theme.js"></script>

<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<link rel="stylesheet" href="../kit.css">

<style>body{background:var(--canvas)} .card-pad{padding:24px}</style>
</head><body><div class="card-pad">
<div class="row" style="gap:12px;align-items:stretch">
  <div style="flex:1;background:linear-gradient(135deg,#a855f7,#3b82f6);border-radius:14px;padding:16px;color:#fff;display:flex;flex-direction:column;justify-content:center;text-align:center">
    <div style="font:700 16px var(--font-sans)">✨ AI‑powered magic ✨</div>
    <div style="font:400 11px var(--font-sans);margin-top:4px;opacity:0.9">purple gradient · emoji · sales copy</div>
  </div>
  <div style="flex:1;background:var(--surface);border-left:4px solid #ef4444;border-radius:8px;padding:16px">
    <div style="font:600 14px var(--font-sans);color:var(--text-primary)">Warning card</div>
    <div style="font:400 12px var(--font-sans);color:var(--text-muted);margin-top:4px">colored‑left‑border accent — banned</div>
  </div>
  <div style="flex:1;border-radius:8px;padding:16px;background:rgba(255,255,255,0.6);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.4)">
    <div style="font:600 14px var(--font-sans)">Glassmorphism</div>
    <div style="font:400 12px var(--font-sans);color:var(--text-muted);margin-top:4px">no blurred panels in product</div>
  </div>
</div>
</div></body></html>
